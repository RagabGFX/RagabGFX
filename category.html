  <script src="script.js"></script>
  <script>
    const data = {
      matchdays: ["MATCHDAYS","01 / SPORTS","Matchday systems, fixtures, line-ups and live sports visuals."],
      "hero-graphics": ["HERO GRAPHICS","02 / VISUALS","High-impact hero compositions and campaign-led sports visuals."],
      identities: ["IDENTITIES","03 / BRANDING","Visual identities, logos, systems and brand applications."],
      manipulation: ["MANIPULATION","04 / ART DIRECTION","Photo manipulation, compositing and cinematic visual direction."]
    };

    const key = new URLSearchParams(location.search).get("cat") || "matchdays";
    const item = data[key] || data.matchdays;

    document.title = "RagabGFX — " + item[0];
    document.getElementById("category-kicker").textContent = item[1];
    document.getElementById("category-title").textContent = item[0];
    document.getElementById("category-desc").textContent = item[2];

    const grid = document.getElementById("sample-grid");
    const count = document.getElementById("sample-count");

    const works = {
      matchdays: [
        ["assets/matchdays/01-al-ahly-vs-palmeiras.webp", "Al Ahly vs Palmeiras", "MATCHDAY"],
        ["assets/matchdays/02-al-ahly-vs-inter-miami.webp", "Al Ahly vs Inter Miami", "MATCHDAY"],
        ["assets/matchdays/03-ettifaq.webp", "Ettifaq Matchday", "MATCHDAY"],
        ["assets/matchdays/04-ligue-1-trophee-des-champions.webp", "Trophee des Champions", "MATCHDAY"],
        ["assets/matchdays/05-jordan-vs-algeria.webp", "Jordan vs Algeria", "MATCHDAY"],
        ["assets/matchdays/06-matchday.webp", "Matchday", "MATCHDAY"],
        ["assets/matchdays/07-neom-vs-al-qadsiah.webp", "NEOM vs Al Qadsiah", "MATCHDAY"],
        ["assets/matchdays/08-saudi-vs-uruguay.webp", "Saudi Arabia vs Uruguay", "MATCHDAY"],
        ["assets/matchdays/09-psg-vs-marseille.webp", "PSG vs Marseille", "MATCHDAY"],
        ["assets/matchdays/10-wijnaldum.webp", "Wijnaldum — To the Final", "MATCHDAY"]
      ],
      "hero-graphics": [
        ["assets/hero-graphics/01-1080x1350.webp","Saudi League","HERO GRAPHIC"],
        ["assets/hero-graphics/02-arakji-psd.webp","Basketball","HERO GRAPHIC"],
        ["assets/hero-graphics/03-neom-vs-alhilal.webp","NEOM × Al Hilal","HERO GRAPHIC"],
        ["assets/hero-graphics/04-kings-cup-final.webp","King's Cup","HERO GRAPHIC"],
        ["assets/hero-graphics/05-himad-abdelli.webp","Ligue 1","HERO GRAPHIC"],
        ["assets/hero-graphics/06-nayef-aguerd.webp","Ligue 1","PLAYER GRAPHIC"],
        ["assets/hero-graphics/07-spain-vs-saudi.webp","World Cup","MATCHDAY GRAPHIC"],
        ["assets/hero-graphics/08-mostafa-mohamed.webp","Mostafa Mohamed","HERO GRAPHIC"],
        ["assets/hero-graphics/09-al-jazira.webp","Al Jazira","QUALIFICATION GRAPHIC"],
        ["assets/hero-graphics/10-scorrer.webp","Saudi League","CONCEPT GRAPHIC"]
      ]
    };

    const selected = works[key];

    if (selected) {
      grid.innerHTML = selected.map(([file, title, type], i) => `
        <article class="sample-card reveal is-visible" tabindex="0" role="button" aria-label="Open ${title}">
          <img class="sample-image" src="${file}" alt="${title}" loading="${i < 3 ? "eager" : "lazy"}">
          <div class="sample-info">
            <div>
              <small>${type}</small>
              <strong>${title}</strong>
            </div>
            <span class="sample-index">${String(i + 1).padStart(2, "0")}</span>
          </div>
        </article>
      `).join("");
      count.textContent = String(selected.length).padStart(2, "0") + " SELECTED WORKS";
    } else {
      grid.innerHTML = `
        <div class="sample-placeholder"><strong>YOUR WORK GOES HERE</strong><span>Drop your images into the matching assets folder and add them to the category list.</span></div>
        <div class="sample-placeholder"><strong>READY FOR YOUR PROJECTS</strong><span>The category structure is ready for the next batch.</span></div>
        <div class="sample-placeholder"><strong>CASE STUDIES NEXT</strong><span>We can turn any selected sample into a full project page later.</span></div>`;
      count.textContent = "03 PLACEHOLDERS";
    }
  </script>


<div class="portfolio-lightbox" id="portfolioLightbox" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <img id="lbImage" alt="">
  <button class="lb-next" id="lbNext" aria-label="Next">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>
<script>
(function(){
  const box=document.getElementById('portfolioLightbox');
  const image=document.getElementById('lbImage');
  const close=document.getElementById('lbClose');
  const prev=document.getElementById('lbPrev');
  const next=document.getElementById('lbNext');
  const counter=document.getElementById('lbCounter');
  if(!box) return;

  let cards=[];
  let index=0;

  function refresh(){
    cards=[...document.querySelectorAll('.sample-card')];
  }
  function open(i){
    refresh();
    if(!cards.length) return;
    index=(i+cards.length)%cards.length;
    const img=cards[index].querySelector('img');
    image.src=img.currentSrc || img.src;
    image.alt=img.alt || '';
    counter.textContent=String(index+1).padStart(2,'0')+' / '+String(cards.length).padStart(2,'0');
    box.classList.add('is-open');
    box.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  }
  function shut(){
    box.classList.remove('is-open');
    box.setAttribute('aria-hidden','true');
    image.removeAttribute('src');
    document.body.style.overflow='';
  }
  function go(delta){open(index+delta)}

  document.addEventListener('click',e=>{
    const card=e.target.closest('.sample-card');
    if(card){
      e.preventDefault();
      refresh();
      open(cards.indexOf(card));
    }
  });
  close.addEventListener('click',shut);
  prev.addEventListener('click',()=>go(-1));
  next.addEventListener('click',()=>go(1));
  box.addEventListener('click',e=>{if(e.target===box) shut()});
  document.addEventListener('keydown',e=>{
    if(!box.classList.contains('is-open')) return;
    if(e.key==='Escape') shut();
    if(e.key==='ArrowLeft') go(-1);
    if(e.key==='ArrowRight') go(1);
  });
})();
</script>

</body>
</html>
