<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RagabGFX — Selected Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="inner-page">
  <div class="noise"></div>
  <header class="nav glass">
    <a class="brand" href="index.html">Ragab<span>GFX</span></a>
    <nav><a href="index.html#work">Work</a><a href="index.html#clients">Clients</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav>
    <a class="nav-cta" href="index.html#contact">Let's talk <span>↗</span></a>
  </header>

  <main class="category-page">
    <a class="back" href="index.html#work">← Back to work</a>
    <div class="category-hero reveal">
      <p class="eyebrow" id="category-kicker">SELECTED WORK</p>
      <h1 id="category-title">MATCHDAYS</h1>
      <p id="category-desc"></p>
    </div>

    <div class="samples-head">
      <span>SELECTED SAMPLES</span><span id="sample-count"></span>
    </div>
    <div class="sample-grid" id="sample-grid"></div>
  </main>
  <footer><span>© 2026 RagabGFX</span><span>Selected work.</span></footer>
  <script src="script.js"></script>
  <script>
    const data = {
      matchdays: ["MATCHDAYS","01 / SPORTS","Matchday systems, fixtures, line-ups and live sports visuals."],
      "hero-graphics": ["HERO GRAPHICS","02 / VISUALS","High-impact hero compositions and campaign-led sports visuals."],
      identities: ["IDENTITIES","03 / BRANDING","Visual identities, logos, systems and brand applications."],
      manipulation: ["MANIPULATION","04 / ART DIRECTION","Photo manipulation, compositing and cinematic visual direction."]
    };
    const key = new URLSearchParams(location.search).get("cat") || "matchdays";
    const item = data[key] || data.matchdays;
    document.title = "RagabGFX — " + item[0];
    document.getElementById("category-kicker").textContent = item[1];
    document.getElementById("category-title").textContent = item[0];
    document.getElementById("category-desc").textContent = item[2];
    const grid = document.getElementById("sample-grid");
    if (key === "hero-graphics") {
      const heroImages = [
        ["01-saudi-league.webp", "Saudi League"],
        ["02-basketball.webp", "Dubai Basketball"],
        ["03-neom-vs-alhilal.webp", "NEOM vs Al Hilal"],
        ["04-kings-cup.webp", "King's Cup"],
        ["05-ligue1-himad.webp", "Ligue 1 — Himad Abdelli"],
        ["06-ligue1-aguerd.webp", "Ligue 1 — Nayef Aguerd"],
        ["07-world-cup.webp", "World Cup — Spain vs Saudi Arabia"],
        ["08-mostafa-mohamed.webp", "Mostafa Mohamed"],
        ["09-aljazira.webp", "Al Jazira — To The Final"],
        ["10-rsl.webp", "Saudi League — RSL"]
      ];
      grid.innerHTML = heroImages.map(([file, title]) => `
        <article class="sample-card reveal is-visible">
          <div class="sample-image-wrap"><img class="sample-image" src="assets/hero-graphics/${file}" alt="${title}" loading="lazy"></div>
          <div class="sample-caption"><span>${title}</span><small>HERO GRAPHIC</small></div>
        </article>`).join("");
      document.getElementById("sample-count").textContent = "10 SAMPLES";
    } else {
      grid.innerHTML = `
        <div class="sample-placeholder"><strong>YOUR WORK GOES HERE</strong><span>Drop your images into the matching assets folder and duplicate a sample card in category.html.</span></div>
        <div class="sample-placeholder"><strong>READY FOR YOUR PROJECTS</strong><span>The structure is already built for category-by-category samples.</span></div>
        <div class="sample-placeholder"><strong>CASE STUDIES NEXT</strong><span>We can turn any sample into a full project page later.</span></div>`;
      document.getElementById("sample-count").textContent = "03 PLACEHOLDERS";
    }
  </script>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const cat = params.get('cat');
  if(cat !== 'hero-graphics') return;

  const grid = document.getElementById('sample-grid');
  const count = document.getElementById('sample-count');
  if(!grid) return;

  const heroWorks = [
    ['assets/hero-graphics/01-1080x1350.webp','Saudi League','Hero Graphic'],
    ['assets/hero-graphics/02-arakji-psd.webp','Basketball','Hero Graphic'],
    ['assets/hero-graphics/03-neom-vs-alhilal.webp','NEOM × Al Hilal','Hero Graphic'],
    ['assets/hero-graphics/04-kings-cup-final.webp', "King's Cup",'Hero Graphic'],
    ['assets/hero-graphics/05-himad-abdelli.webp','Ligue 1','Hero Graphic'],
    ['assets/hero-graphics/06-nayef-aguerd.webp','Ligue 1','Player Graphic'],
    ['assets/hero-graphics/07-spain-vs-saudi.webp','World Cup','Matchday Graphic'],
    ['assets/hero-graphics/08-mostafa-mohamed.webp','Mostafa Mohamed','Hero Graphic'],
    ['assets/hero-graphics/09-al-jazira.webp','Al Jazira','Qualification Graphic'],
    ['assets/hero-graphics/10-scorrer.webp','Saudi League','Concept Graphic']
  ];

  grid.innerHTML = '';
  heroWorks.forEach((w,i)=>{
    const card=document.createElement('article');
    card.className='sample-card reveal is-visible';
    card.innerHTML =
      '<img loading="'+(i<3?'eager':'lazy')+'" src="'+w[0]+'" alt="'+w[1]+'">'+
      '<div class="sample-info"><div><small>'+w[2]+'</small><strong>'+w[1]+'</strong></div>'+
      '<span class="sample-index">'+String(i+1).padStart(2,'0')+'</span></div>';
    grid.appendChild(card);
  });
  if(count) count.textContent = String(heroWorks.length).padStart(2,'0') + ' SELECTED WORKS';
})();
</script>

</body>
</html>
