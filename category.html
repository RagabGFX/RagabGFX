<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RagabGFX — Selected Work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="inner-page">
  <div class="noise"></div>
  <header class="nav glass">
    <a class="brand" href="index.html">Ragab<span>GFX</span></a>
    <nav><a href="index.html#work">Work</a><a href="index.html#clients">Clients</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav>
    <a class="nav-cta" href="index.html#contact">Let's talk <span>↗</span></a>
  </header>

  <main class="category-page">
    <a class="back" href="index.html#work">← Back to work</a>
    <div class="category-hero reveal">
      <p class="eyebrow" id="category-kicker">SELECTED WORK</p>
      <h1 id="category-title">MATCHDAYS</h1>
      <p id="category-desc"></p>
    </div>

    <div class="samples-head">
      <span>SELECTED SAMPLES</span><span id="sample-count"></span>
    </div>
    <div class="sample-grid" id="sample-grid"></div>
  </main>
  <footer><span>© 2026 RagabGFX</span><span>Selected work.</span></footer>
  <script src="script.js"></script>
  <script>
    const data = {
      matchdays: ["MATCHDAYS","01 / SPORTS","Matchday systems, fixtures, line-ups and live sports visuals."],
      "hero-graphics": ["HERO GRAPHICS","02 / VISUALS","High-impact hero compositions and campaign-led sports visuals."],
      identities: ["IDENTITIES","03 / BRANDING","Visual identities, logos, systems and brand applications."],
      manipulation: ["MANIPULATION","04 / ART DIRECTION","Photo manipulation, compositing and cinematic visual direction."]
    };

    const key = new URLSearchParams(location.search).get("cat") || "matchdays";
    const item = data[key] || data.matchdays;
    document.title = "RagabGFX — " + item[0];
    document.getElementById("category-kicker").textContent = item[1];
    document.getElementById("category-title").textContent = item[0];
    document.getElementById("category-desc").textContent = item[2];

    const grid = document.getElementById("sample-grid");
    const count = document.getElementById("sample-count");

    const works = {
      "hero-graphics": [
        ["assets/hero-graphics/01-saudi-league.webp", "Saudi League", "Hero Graphic"],
        ["assets/hero-graphics/02-basketball.webp", "Dubai Basketball", "Hero Graphic"],
        ["assets/hero-graphics/03-neom-vs-alhilal.webp", "NEOM × Al Hilal", "Hero Graphic"],
        ["assets/hero-graphics/04-kings-cup.webp", "King's Cup", "Hero Graphic"],
        ["assets/hero-graphics/05-ligue1-himad.webp", "Ligue 1 — Himad Abdelli", "Hero Graphic"],
        ["assets/hero-graphics/06-ligue1-aguerd.webp", "Ligue 1 — Nayef Aguerd", "Player Graphic"],
        ["assets/hero-graphics/07-world-cup.webp", "World Cup — Spain vs Saudi Arabia", "Matchday Graphic"],
        ["assets/hero-graphics/08-mostafa-mohamed.webp", "Mostafa Mohamed", "Hero Graphic"],
        ["assets/hero-graphics/09-aljazira.webp", "Al Jazira — To The Final", "Qualification Graphic"],
        ["assets/hero-graphics/10-rsl.webp", "Saudi League — RSL", "Concept Graphic"]
      ],
      manipulation: [
        ["assets/manipulation/al-jazira-training-camp.webp", "Al Jazira — Training Camp", "Photo Manipulation"],
        ["assets/manipulation/devil-casemiro.webp", "Casemiro — Devil Concept", "Photo Manipulation"],
        ["assets/manipulation/kings-cup-countdown.webp", "King's Cup — Countdown", "Photo Manipulation"],
        ["assets/manipulation/ligue1-egypt-to-the-final.webp", "Ligue 1 — Egypt To The Final", "Photo Manipulation"],
        ["assets/manipulation/ligue1-nabil-bentaleb-lyon.webp", "Nabil Bentaleb — Lyon", "Photo Manipulation"],
        ["assets/manipulation/ligue1-new-year.webp", "Ligue 1 — New Year", "Photo Manipulation"],
        ["assets/manipulation/ligue1-saudi-player-ramadan.webp", "Ligue 1 — Ramadan", "Photo Manipulation"],
        ["assets/manipulation/ligue1-yassir-zabiri-rennes.webp", "Yassir Zabiri — Rennes", "Photo Manipulation"],
        ["assets/manipulation/onana.webp", "Onana — Concept", "Photo Manipulation"],
        ["assets/manipulation/salem-al-dawsari-50-goals.webp", "Salem Al-Dawsari — 50 Goals", "Photo Manipulation"],
        ["assets/manipulation/saudi-nt-best-saudi-chant.webp", "Saudi NT — Best Saudi Chant", "Photo Manipulation"],
        ["assets/manipulation/saudi-nt-next-mission-atlanta.webp", "Saudi NT — Next Mission Atlanta", "Photo Manipulation"],
        ["assets/manipulation/neom-vs-al-fateh.webp", "NEOM vs Al Fateh", "Photo Manipulation"],
        ["assets/manipulation/world-football-day.webp", "World Football Day", "Photo Manipulation"]
      ]
    };

    const selected = works[key];
    if (selected) {
      grid.innerHTML = selected.map(([src, title, type], i) => `
        <article class="sample-card reveal is-visible" data-full="${src}" data-title="${title}">
          <div class="sample-image-wrap"><img class="sample-image" src="${src}" alt="${title}" loading="${i < 3 ? 'eager' : 'lazy'}"></div>
          <div class="sample-info"><div><small>${type}</small><strong>${title}</strong></div><span class="sample-index">${String(i + 1).padStart(2,'0')}</span></div>
        </article>`).join('');
      count.textContent = String(selected.length).padStart(2,'0') + ' SELECTED WORKS';
    } else {
      grid.innerHTML = '<div class="sample-placeholder"><strong>SELECTED WORK</strong><span>More projects will be added here.</span></div>';
      count.textContent = '01 SELECTED WORK';
    }

    // Fullscreen viewer — keeps the complete artwork visible without cropping.
    const lightbox = document.createElement('div');
    lightbox.className = 'lightbox';
    lightbox.innerHTML = `
      <button class="lightbox-close" aria-label="Close fullscreen">×</button>
      <div class="lightbox-inner">
        <img class="lightbox-image" alt="">
        <div class="lightbox-title"></div>
      </div>`;
    document.body.appendChild(lightbox);
    const lbImage = lightbox.querySelector('.lightbox-image');
    const lbTitle = lightbox.querySelector('.lightbox-title');

    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.sample-card[data-full]');
      if (!card) return;
      lbImage.src = card.dataset.full;
      lbImage.alt = card.dataset.title;
      lbTitle.textContent = card.dataset.title;
      lightbox.classList.add('is-open');
      document.body.classList.add('lightbox-open');
    });
    const closeLightbox = () => {
      lightbox.classList.remove('is-open');
      document.body.classList.remove('lightbox-open');
    };
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target.closest('.lightbox-close')) closeLightbox();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
</body>
</html>
